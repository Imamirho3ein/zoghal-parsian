      <ellipse cx="460" cy="240" rx="14" ry="22" fill="none" stroke="#2b1b0d" stroke-width="2.5" opacity="0.7"/>
      <ellipse cx="460" cy="240" rx="7" ry="11" fill="none" stroke="#2b1b0d" stroke-width="2" opacity="0.6"/>
    </g>
    <g transform="translate(-6,84)">
