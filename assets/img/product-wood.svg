      <stop offset="1" stop-color="#ededed"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a5b3a"/>
      <stop offset="0.35" stop-color="#4a3320"/>
