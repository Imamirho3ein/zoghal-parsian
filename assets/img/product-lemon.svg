<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ededed"/>
    </radialGradient>
    <linearGradient id="log" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4a4a"/>
      <stop offset="0.45" stop-color="#242424"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
    <radialGradient id="cap" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3c3c3c"/>
      <stop offset="0.7" stop-color="#1d1d1d"/>
      <stop offset="1" stop-color="#0f0f0f"/>
    </radialGradient>
    <filter id="sh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="600" height="450" fill="url(#bg)"/>

  <g filter="url(#sh)" transform="rotate(-12 300 230)">
    <g transform="translate(0,-52)">
      <rect x="150" y="196" width="300" height="62" rx="26" fill="url(#log)"/>
      <ellipse cx="450" cy="227" rx="20" ry="31" fill="url(#cap)"/>
    </g>
    <g transform="translate(18,12)">
      <rect x="150" y="196" width="300" height="62" rx="26" fill="url(#log)"/>
      <ellipse cx="450" cy="227" rx="20" ry="31" fill="url(#cap)"/>
    </g>
    <g transform="translate(-12,76)">
      <rect x="150" y="196" width="300" height="62" rx="26" fill="url(#log)"/>
      <ellipse cx="450" cy="227" rx="20" ry="31" fill="url(#cap)"/>
    </g>
  </g>

  <ellipse cx="300" cy="380" rx="160" ry="16" fill="#000" opacity="0.07"/>
</svg>
