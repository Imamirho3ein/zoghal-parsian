<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080808"/>
      <stop offset="0.55" stop-color="#111111"/>
      <stop offset="1" stop-color="#2a0f0d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5a1f" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#c3141d" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ember" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd7a1"/>
      <stop offset="0.35" stop-color="#ff7a18"/>
      <stop offset="1" stop-color="#8a0f12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coal1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5c5c5c"/>
      <stop offset="0.5" stop-color="#242424"/>
      <stop offset="1" stop-color="#0c0c0c"/>
    </linearGradient>
    <linearGradient id="coal2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#484848"/>
      <stop offset="1" stop-color="#101010"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>

  <g transform="translate(-720,0)">
    <ellipse cx="820" cy="720" rx="640" ry="380" fill="url(#glow)"/>
    <ellipse cx="380" cy="900" rx="480" ry="260" fill="url(#glow)" opacity="0.75"/>

    <!-- توده زغال -->
    <g opacity="0.98">
      <polygon points="980,760 1160,690 1340,760 1310,910 1090,960 960,880" fill="url(#coal1)"/>
      <polygon points="1160,690 1340,760 1300,790 1120,720" fill="#464646" opacity="0.65"/>
      <polygon points="1360,820 1520,760 1660,820 1630,940 1460,980 1350,910" fill="url(#coal2)"/>
      <polygon points="800,880 940,820 1080,880 1050,1000 900,1030 790,960" fill="url(#coal1)"/>
      <polygon points="1080,600 1200,560 1300,610 1270,700 1150,730 1070,670" fill="url(#coal2)"/>
      <polygon points="1500,660 1590,630 1670,670 1650,730 1560,750 1495,710" fill="url(#coal1)" opacity="0.9"/>
      <polygon points="700,690 790,655 870,700 845,762 755,780 690,742" fill="url(#coal2)" opacity="0.9"/>
    </g>

    <!-- گدازه -->
    <g filter="url(#soft)">
      <ellipse cx="1150" cy="880" rx="200" ry="66" fill="#ff5a12" opacity="0.55"/>
      <ellipse cx="1420" cy="900" rx="120" ry="44" fill="#ff3b0f" opacity="0.38"/>
      <ellipse cx="980" cy="960" rx="130" ry="40" fill="#ff7a18" opacity="0.32"/>
    </g>

    <g>
      <circle cx="1080" cy="850" r="26" fill="url(#ember)"/>
      <circle cx="1240" cy="920" r="18" fill="url(#ember)"/>
      <circle cx="1430" cy="870" r="14" fill="url(#ember)"/>
      <circle cx="970" cy="905" r="12" fill="url(#ember)"/>
      <circle cx="1180" cy="800" r="9" fill="url(#ember)"/>
      <circle cx="1330" cy="835" r="7" fill="url(#ember)"/>
    </g>

    <!-- جرقه‌ها -->
    <g fill="#ffb066" opacity="0.85">
      <circle cx="1120" cy="720" r="3.4"/>
      <circle cx="1210" cy="680" r="2.6"/>
      <circle cx="1310" cy="740" r="2.2"/>
      <circle cx="960" cy="820" r="2.8"/>
      <circle cx="1480" cy="800" r="2.4"/>
      <circle cx="1030" cy="690" r="2"/>
      <circle cx="1390" cy="700" r="1.8"/>
    </g>
  </g>

  <rect width="1920" height="1080" fill="url(#bg)" opacity="0.12"/>
</svg>
